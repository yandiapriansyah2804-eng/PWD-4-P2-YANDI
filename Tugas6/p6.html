<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Latihan Pengulangan dan Tabel Matriks</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            background-color: #f4f4f9;
            color: #333;
        }
        .container {
            max-width: 800px;
            margin: auto;
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }
        h2 {
            color: #2c3e50;
            border-bottom: 2px solid #3498db;
            padding-bottom: 5px;
        }
        .output-box {
            background: #eef2f3;
            padding: 10px 15px;
            border-radius: 5px;
            font-family: monospace;
            font-size: 16px;
            margin-bottom: 20px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
            text-align: center;
        }
        th, td {
            border: 1px solid #ddd;
            padding: 8px;
        }
        th {
            background-color: #2ecc71;
            color: white;
        }
        td:first-child, th:first-child {
            background-color: #27ae60;
            color: white;
            font-weight: bold;
        }
        /* Pewarnaan sel seperti pada gambar */
        tr:nth-child(even) td:not(:first-child) {
            background-color: #00bcd4;
            color: black;
        }
        tr:nth-child(odd) td:not(:first-child) {
            background-color: #ffeb3b;
            color: black;
        }
    </style>
</head>
<body>

<div class="container">
    <!-- Soal 1 -->
    <h2>1. Pengulangan Angka Genap (1 - 10)</h2>
    <div class="output-box" id="hasil-genap"></div>

    <!-- Soal 2 -->
    <h2>2. Tabel Perkalian Matriks</h2>
    <div id="tabel-matriks-container"></div>
</div>

<script>
    // --- 1. Logika Soal 1: Bilangan Genap 1 sampai 10 ---
    let dataGenap = [];
    for (let i = 1; i <= 10; i++) {
        if (i % 2 === 0) {
            dataGenap.push(i);
        }
    }
    document.getElementById("hasil-genap").innerText = dataGenap.join(" ");

    // --- 2. Logika Soal 2: Tabel Perkalian Matriks ---
    let container = document.getElementById("tabel-matriks-container");
    let table = document.createElement("table");

    // Membuat Header Tabel
    let headerRow = document.createElement("tr");
    let thBilangan = document.createElement("th");
    thBilangan.innerText = "bilangan";
    headerRow.appendChild(thBilangan);

    for (let j = 1; j <= 10; j++) {
        let th = document.createElement("th");
        th.innerText = j;
        headerRow.appendChild(th);
    }
    table.appendChild(headerRow);

    // Membuat Isi Matriks (1 sampai 10)
    for (let i = 1; i <= 10; i++) {
        let row = document.createElement("tr");
        
        // Header Baris
        let tdHeader = document.createElement("td");
        tdHeader.innerText = i;
        row.appendChild(tdHeader);

        // Kolom Perkalian
        for (let j = 1; j <= 10; j++) {
            let td = document.createElement("td");
            td.innerText = i * j;
            row.appendChild(td);
        }
        table.appendChild(row);
    }

    container.appendChild(table);
</script>

</body>
</html>
